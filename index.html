<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FactTrace</title>
<style>
:root{
  --bone:#F2F0EB; --ink:#14130F; --rule:rgba(20,19,15,.14);
  --mute:rgba(20,19,15,.50); --faint:rgba(20,19,15,.06);
  --flag:#A8321E; --ok:#2F5D42;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bone:#111110; --ink:#E9E6DE; --rule:rgba(233,230,222,.16);
    --mute:rgba(233,230,222,.52); --faint:rgba(233,230,222,.06);
    --flag:#E0705A; --ok:#7FB093;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bone);color:var(--ink);font-family:var(--serif);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:transparent;border:0}
button{cursor:pointer}

.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}

#shell{display:grid;grid-template-columns:190px minmax(0,1fr);
  max-width:1200px;margin:0 auto;min-height:100vh}

/* nav */
#nav{border-right:1px solid var(--rule);padding:34px 22px 34px 0;
  position:sticky;top:0;align-self:start;height:100vh;
  display:flex;flex-direction:column;gap:26px}
#brand{font-size:19px;letter-spacing:-.02em}
#brand small{display:block;margin-top:3px}
#tabs{display:flex;flex-direction:column;gap:2px}
#tabs button{text-align:left;padding:5px 0;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#tabs button[aria-selected=true]{color:var(--ink)}
#tabs button .n{float:right;font-variant-numeric:tabular-nums}
#navfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#navfoot button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}
#navfoot button:hover{color:var(--ink)}

/* main */
#main{padding:34px 0 100px 34px;min-width:0}
section[hidden]{display:none}
h2{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 16px}
.row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px}
.field select,.field input{border-bottom:1px solid var(--rule);padding:3px 0;min-width:74px}
.field select:focus,.field input:focus{outline:none;border-bottom-color:var(--ink)}
textarea{width:100%;min-height:230px;border:1px solid var(--rule);padding:16px;
  font-size:17px;line-height:1.65;resize:vertical;background:var(--faint)}
textarea:focus{outline:none;border-color:var(--ink)}
.act{border:1px solid var(--ink);padding:8px 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase}
.act:hover{background:var(--ink);color:var(--bone)}
.ghost{border:1px solid var(--rule);padding:5px 12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ghost:hover{border-color:var(--ink);color:var(--ink)}

/* atoms */
.atom{border-top:1px solid var(--rule);padding:16px 0}
.atom:last-child{border-bottom:1px solid var(--rule)}
.atom .head{display:flex;gap:12px;align-items:baseline}
.atom .q{font-size:18px;margin:7px 0 11px;letter-spacing:-.01em}
.atom .slots{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.atom select,.atom input{border-bottom:1px solid var(--rule);padding:2px 0;
  font-family:var(--mono);font-size:11px}
.atom input[type=number]{width:52px;text-align:right}
.atom .del{color:var(--mute);font-family:var(--mono);font-size:10px;margin-left:auto}
.atom .del:hover{color:var(--flag)}
/* 진술자가 말한 것이 아니라 앞 문맥에서 끌어온 슬롯 */
.atom select.inf{border-bottom:1px dashed var(--flag);color:var(--flag)}
.warn{color:var(--flag)}
#sum{display:flex;gap:18px;padding:0 0 16px;flex-wrap:wrap}
.tray{border:1px solid var(--flag);padding:14px 16px;margin-bottom:22px}
.tray .r{display:flex;gap:10px;align-items:center;padding:5px 0;flex-wrap:wrap}

/* timeline */
#phedit{margin-bottom:20px}
#phedit input{border-bottom:1px solid var(--rule);padding:3px 0;width:74px;
  font-family:var(--mono);font-size:11px;text-align:center}
#phedit input:focus{outline:none;border-bottom-color:var(--ink)}
#tl{overflow-x:auto}
.tlg{display:grid;min-width:660px}
.tlg>div{padding:9px 8px;border-top:1px solid var(--rule)}
.tlg .hd{border-top:0;padding-bottom:11px}
.tlg .who{font-size:18px;letter-spacing:-.01em}
.tlg .cell{min-height:46px}
.tlg .cell.gap{background:var(--faint)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  border:1px solid var(--rule);padding:1px 5px;margin:0 3px 3px 0}
.chip.hot{border-color:var(--flag);color:var(--flag)}
.chip.ev{border-style:dashed}
.dash{color:var(--flag);font-family:var(--mono);font-size:11px}

/* conflicts */
.cf{border-top:1px solid var(--rule);padding:18px 0}
.cf:last-child{border-bottom:1px solid var(--rule)}
.cf .top{display:flex;gap:11px;align-items:baseline;margin-bottom:11px}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 6px;
  border:1px solid currentColor}
.sev-hard{color:var(--flag)} .sev-med{color:var(--ink)} .sev-soft{color:var(--mute)}
.cf .pair{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cf .side{border-left:2px solid var(--rule);padding-left:13px}
.cf .side.hot{border-left-color:var(--flag)}
.cf .side p{margin:5px 0 0;font-size:16px}
.cf .why{margin-top:11px;font-size:13px;color:var(--mute)}

/* assess */
.sp{border-top:1px solid var(--rule);padding:20px 0}
.sp:last-of-type{border-bottom:1px solid var(--rule)}
.sp .nm{font-size:26px;letter-spacing:-.02em;margin-bottom:12px}
.axes{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.ax .v{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  line-height:1.05;margin:3px 0 5px}
.bar{height:2px;background:var(--rule)}
.bar i{display:block;height:2px;background:var(--ink)}
.stage{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--mute);
  margin:18px 0 8px;text-transform:uppercase}
#rank{margin-bottom:34px}
.rk{display:grid;grid-template-columns:26px 1fr 74px;gap:14px;align-items:center;
  padding:11px 0;border-top:1px solid var(--rule)}
.rk .who{font-size:20px}
.rk .sc{text-align:right;font-variant-numeric:tabular-nums;font-size:20px}
.rk.top .who,.rk.top .sc{color:var(--flag)}
.rk .ev{grid-column:2/4;font-size:13px;color:var(--mute);margin-top:-4px}
.empty{color:var(--mute);font-size:15px;padding:22px 0}
@media(max-width:820px){
  #shell{grid-template-columns:1fr}
  #nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);
    padding:22px 0;flex-direction:row;align-items:baseline;gap:20px;flex-wrap:wrap}
  #tabs{flex-direction:row;gap:16px}#tabs button .n{float:none;margin-left:5px}
  #navfoot{margin:0;flex-direction:row}
  #main{padding:26px 0 80px}
  .cf .pair{grid-template-columns:1fr}
  .axes{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="shell">
  <nav id="nav">
    <div id="brand">FactTrace<small class="lbl">진술 원자 분석</small></div>
    <div id="tabs">
      <button data-v="ingest" aria-selected="true">Ingest</button>
      <button data-v="atoms" aria-selected="false">Atoms<span class="n" id="n-atoms">0</span></button>
      <button data-v="timeline" aria-selected="false">Timeline</button>
      <button data-v="conflict" aria-selected="false">Conflict<span class="n" id="n-cf">0</span></button>
      <button data-v="assess" aria-selected="false">Assess</button>
    </div>
    <div id="navfoot">
      <button id="b-import">Import</button>
      <button id="b-export">Export</button>
      <button id="b-sample">Sample</button>
      <button id="b-clear">Clear</button>
      <input type="file" id="f-import" accept="application/json" hidden>
    </div>
  </nav>

  <main id="main">
    <section id="v-ingest">
      <h2>Ingest</h2>
      <div class="row" style="margin-bottom:16px">
        <label class="field"><span class="lbl">화자</span>
          <input id="i-speaker" value="A" list="dl-speakers"></label>
        <datalist id="dl-speakers"></datalist>
        <label class="field"><span class="lbl">회차</span>
          <select id="i-round"><option>1</option><option>2</option><option>3</option></select></label>
        <label class="field"><span class="lbl">출처</span>
          <select id="i-src"><option value="statement">진술</option><option value="evidence">물증</option></select></label>
      </div>
      <textarea id="i-text" placeholder="진술을 그대로 붙여넣으세요."></textarea>
      <div class="row" style="margin-top:16px">
        <button class="act" id="b-atomize">원자화</button>
        <span class="lbl" id="i-note"></span>
      </div>
    </section>

    <section id="v-atoms" hidden>
      <h2>Atoms</h2>
      <div id="sum"></div>
      <div id="tray"></div>
      <div id="atoms"></div>
    </section>

    <section id="v-timeline" hidden>
      <h2>Timeline</h2>
      <div id="phedit" class="row"></div>
      <div id="tl"></div>
    </section>

    <section id="v-conflict" hidden>
      <h2>Conflict</h2>
      <div id="cflist"></div>
    </section>

    <section id="v-assess" hidden>
      <h2>Assess</h2>
      <div id="rank"></div>
      <div id="scores"></div>
    </section>
  </main>
</div>

<script>
/* ==FACTTRACE-ENGINE-START== */
(function (root) {
'use strict';

/* ---------------------------------------------------------------- 1. 사전 */

// 위치 포함 트리. parent 를 타고 올라가 조상-자손이면 같은 구역으로 본다.
const LOCATION_SEED = {
  L_ROOM   : { name:'연구실',        parent:null,     aliases:['연구실','방','실내','사무실','현장'] },
  L_LEFT   : { name:'연구실 왼쪽',   parent:'L_ROOM', aliases:['연구실 왼쪽','왼쪽','좌측'] },
  L_SHELF  : { name:'책장',          parent:'L_LEFT', aliases:['책장','서가','책꽂이','책장 앞','책장 쪽'] },
  L_SHELF2 : { name:'책장 두 번째 칸',parent:'L_SHELF',aliases:['책장 두 번째 칸','두 번째 칸','둘째 칸','2번째 칸'] },
  L_DESK   : { name:'교수 책상',     parent:'L_ROOM', aliases:['교수 책상','교수님 책상','책상','책상 쪽','책상 옆','책상 앞','데스크'] },
  L_DRAWER : { name:'책상 서랍',     parent:'L_DESK', aliases:['책상 서랍','서랍','서랍 안','서랍장'] },
  L_DESKTOP: { name:'책상 위',       parent:'L_DESK', aliases:['책상 위','상판'] },
  L_WINDOW : { name:'창가',          parent:'L_ROOM', aliases:['창가','창문','창문 쪽','창 쪽','창측'] },
  L_SOFA   : { name:'소파',          parent:'L_ROOM', aliases:['소파','소파 옆','소파 쪽'] },
  L_CHAIR  : { name:'의자',          parent:'L_ROOM', aliases:['의자','의자 위','의자 앞','책상 맞은편'] },
  L_CABINET: { name:'캐비닛',        parent:'L_ROOM', aliases:['캐비닛','사물함','보관함'] },
  L_DOOR   : { name:'출입구',        parent:'L_ROOM', aliases:['연구실 출입구','출입구','출입문','현관','입구','문'] }
};

const ENTITY_SEED = [
  { id:'E_MONEY',   canonical:'현금',      aliases:['현금','돈','지폐','봉투','돈봉투','현금 봉투','오만원권','만원권','현금다발'] },
  { id:'E_FILE',    canonical:'논문 파일', aliases:['논문 파일','논문','파일','자료','서류'] },
  { id:'E_BAG',     canonical:'가방',      aliases:['가방','백팩','배낭','에코백'] },
  { id:'E_CHARGER', canonical:'충전기',    aliases:['충전기','어댑터','케이블'] },
  { id:'E_BOX',     canonical:'개인 상자', aliases:['개인 상자','상자','박스'] },
  { id:'E_DRAWER',  canonical:'책상 서랍', aliases:['책상 서랍','서랍','서랍장'] },
  { id:'E_CHAIR',   canonical:'의자',      aliases:['의자'] },
  { id:'E_DOOR',    canonical:'출입문',    aliases:['출입문','문'] },
  { id:'E_LAPTOP',  canonical:'노트북',    aliases:['노트북','랩탑'] },
  { id:'E_WALLET',  canonical:'지갑',      aliases:['지갑'] },
  { id:'E_KEY',     canonical:'열쇠',      aliases:['열쇠','키','키카드','카드키'] }
];

// 뒤쪽(서술어 자리)에서 잡힌 것을 우선한다. prio 는 같은 위치에서 겹칠 때만 쓴다.
const PREDICATES = [
  { id:'은닉',     prio:13, re:/숨기|숨겼|숨겨|감췄|감추|묻었|은닉/ },
  { id:'획득',     prio:12, re:/가져[가갔간갈올왔와오]|챙겼|챙기|꺼냈|꺼내|집었|주웠|가방에\s*넣|주머니에\s*넣|획득|빼냈|빼내/ },
  { id:'개폐',     prio:11, re:/열었|열고|열어|닫았|닫고|닫아|잠갔|잠그|풀었/ },
  { id:'접촉',     prio:10, re:/만졌|만지|만진|손대|손댔|건드렸|건드리|잡았|짚었/ },
  { id:'퇴실',     prio:9,  re:/나왔|나갔|나오|나가|퇴실|빠져나/ },
  { id:'입실',     prio:8,  re:/들어[가갔간와왔오옵섰설]|입실|들어서/ },
  { id:'이동',     prio:7,  re:/갔|왔|가서|와서|향했|향해|이동|옮겼|올라갔|내려갔|가지\s*않|오지\s*않|간\s*적/ },
  // '다가' 를 그대로 두면 '있다가' 같은 연결어미가 접근으로 잡힌다
  { id:'접근',     prio:6,  re:/접근|다가[가갔서선섰와왔]|쪽으로|옆으로|앞으로|근처/ },
  { id:'부재',     prio:5,  re:/없었|없더|없길래|안\s*보였|비어\s*있|비었|사라졌|텅/ },
  { id:'목격',     prio:4,  re:/봤|보였|보이|목격|있었|있더|있던|있길래|있는\s*[걸것]|놓여|얹혀|앉아\s*있/ },
  { id:'내려놓음', prio:3,  re:/내려놨|내려놓|놓았|놨|뒀|두었|올려놨|올려놓/ },
  { id:'확인',     prio:2,  re:/확인|살펴|세어|세보|점검|훑어|들춰/ },
  { id:'정리',     prio:1,  re:/정리|치웠|치우|원위치|제자리|밀었|밀어|닦았/ }
];

// 화자가 그 장소에 있었음을 함의하는 술어
const PRESENCE = new Set(['이동','접근','접촉','개폐','획득','확인','정리','내려놓음','은닉','입실','퇴실']);
// 그 자리에 있었는가 자체를 다투는 술어. "만지지 않았다"는 접촉의 부인이지
// 그 자리에 없었다는 뜻이 아니므로 여기서 제외한다.
const MOVEMENT = new Set(['이동','접근','입실','퇴실']);
// 화자가 아니라 대상의 상태를 말하는 술어
const STATEP   = new Set(['목격','부재']);

const RE_NEG   = /않았|않는|않습니|않아|안\s*[갔봤했]|못\s*[갔봤했]|아닙|아니었|적\s*없|없습니다만/;
const RE_HEDGE = /아마|같습니|같아요|같았|것\s*같|듯|기억이\s*안|기억이\s*잘|잘\s*모르|확실치|확실하지\s*않|수도\s*있|지\s*않을까|라고\s*생각|싶습니다|인지\s*모르|가물/;
const RE_TIME  = /\d{1,2}\s*시\s*\d{0,2}\s*분?|\d{1,2}\s*:\s*\d{1,2}|\d{1,3}\s*분(?:\s*\d{1,3}\s*초)?|\d{1,3}\s*초/;

// 절 경계. 어미는 왼쪽 절에 붙여 두어야 서술어 판정이 살아 있는다.
// split() 으로 소비하면 "그 다음에" 의 '에' 처럼 조각이 남으므로 경계 위치만 찾는다.
const CLAUSE_TAIL = /(?:가서|와서|아서|어서|해서|고서|고는|면서|자마자|다가|길래|느라|는데|지만|으나|나서|[ㄴ은한는]\s*(?:다음|뒤|후)에?|고)(?=\s)/g;
// 접속 부사는 어느 절에도 속하지 않으므로 통째로 들어낸다.
const CLAUSE_ADV = /(?:그리고|그다음에?|그\s*다음에?|그러고는?|그런\s*다음|그\s*후에?|그\s*뒤에?|그리곤|이후에)\s*/g;

// 사건 전체 타임라인. 초 단위 대신 이 구간이 시간의 단위다.
// 진술에서 초를 지어낼 수 없으므로 굵게 나누고 사람이 손으로 옮긴다.
const PHASE_SEED = ['입실', '초반', '중반', '후반', '퇴실'];

// 앞선 원자를 가리키는 지시 표현
const PRON_LOC = /거기|그곳|여기|이곳|그\s*자리|같은\s*자리|그\s*쪽|그쪽|거기서/;
const PRON_ENT = /그것|그거|그걸|그게|이것|이거|이걸|저거|그\s*물건|그것들/;
const PRON_PER = /걔|쟤|그\s*사람|그\s*애|그분|그\s*친구|본인/;

/* ------------------------------------------------------- 2. 한국어 정규화 */

const PARTICLES = ['에서는','으로는','에게서','한테서','에서','에게','한테','으로','까지','부터','이랑','에는','께서','라고','이나','만을','만은','은','는','이','가','을','를','에','의','와','과','도','만','로','랑'];

function nfc(s){ return String(s == null ? '' : s).normalize('NFC'); }

function stripParticles(s){
  let t = s.trim();
  for (const p of PARTICLES){
    if (t.length > p.length + 1 && t.endsWith(p)) { t = t.slice(0, -p.length); break; }
  }
  return t.trim();
}

function normKo(s){
  let t = nfc(s).replace(/[“”"'‘’()\[\]]/g,' ').replace(/\s+/g,' ').trim();
  t = t.replace(/(습니다|했습니다|였습니다|입니다|어요|아요|았다|었다|했다|한다)$/,'');
  return stripParticles(t);
}

function bigrams(s){
  const t = nfc(s).replace(/\s+/g,'');
  if (t.length < 2) return t ? [t] : [];
  const out = [];
  for (let i = 0; i < t.length - 1; i++) out.push(t.slice(i, i+2));
  return out;
}

function jaccard(a, b){
  const A = new Set(bigrams(a)), B = new Set(bigrams(b));
  if (!A.size || !B.size) return 0;
  let inter = 0;
  A.forEach(x => { if (B.has(x)) inter++; });
  return inter / (A.size + B.size - inter);
}

/* ------------------------------------------------------------ 3. 위치 트리 */

function ancestry(id, tree){
  const chain = []; let cur = id, guard = 0;
  while (cur && tree[cur] && guard++ < 32){ chain.push(cur); cur = tree[cur].parent; }
  return chain;
}
function sameZone(a, b, tree){
  if (!a || !b) return false;
  if (a === b) return true;
  return ancestry(a, tree).includes(b) || ancestry(b, tree).includes(a);
}
function disjointZone(a, b, tree){
  if (!a || !b || a === b) return false;
  return !sameZone(a, b, tree);
}

/* -------------------------------------------------------------- 4. 해소 */

// 가장 긴 별칭이 이긴다. "책상 서랍" 이 "책상" 보다 먼저 잡히도록.
function resolveLocation(text, tree){
  const t = nfc(text);
  let best = null;
  for (const id in tree){
    for (const a of tree[id].aliases){
      const i = t.indexOf(a);
      if (i >= 0 && (!best || a.length > best.len || (a.length === best.len && i > best.at)))
        best = { id, len:a.length, at:i, surface:a };
    }
  }
  return best;
}

function resolveEntity(text, reg){
  const t = nfc(text);
  let best = null;
  for (const e of reg){
    for (const a of e.aliases){
      const i = t.indexOf(a);
      if (i >= 0 && (!best || a.length > best.len)) best = { id:e.id, len:a.length, at:i, surface:a };
    }
  }
  return best;
}

function suggestEntities(text, reg, k){
  return reg
    .map(e => ({ id:e.id, canonical:e.canonical,
                 score: Math.max.apply(null, e.aliases.map(a => jaccard(text, a))) }))
    .filter(x => x.score >= 0.34)
    .sort((a,b) => b.score - a.score)
    .slice(0, k || 3);
}

/* ------------------------------------------------------------ 5. 원자화 */

function splitSentences(text){
  return nfc(text)
    .split(/(?<=[.!?…])\s+|\n+/)
    .map(s => s.trim())
    .filter(s => s.length > 1);
}

function splitClauses(sentence){
  const src = nfc(sentence);
  // 접속 부사를 같은 길이의 공백으로 덮어 인덱스를 보존한다
  const s = src.replace(CLAUSE_ADV, m => ' '.repeat(m.length));
  const bounds = [0];
  const re = new RegExp(CLAUSE_TAIL.source, 'g');
  let m;
  while ((m = re.exec(s)) !== null) bounds.push(m.index + m[0].length);
  bounds.push(s.length);
  const out = [];
  for (let i = 0; i < bounds.length - 1; i++){
    const piece = s.slice(bounds[i], bounds[i + 1]).trim();
    if (piece.length > 1) out.push(piece);
  }
  return out.length ? out : [src.trim()];
}

// 서술어는 절의 뒤쪽에서 끝나는 것을 우선한다. 시작 위치로 재면
// '들어갔다' 의 '갔' 이 '들어가' 를 이겨 입실이 이동으로 뒤집힌다.
function detectPredicate(clause){
  const t = nfc(clause);
  let best = null;
  for (const p of PREDICATES){
    const m = t.match(p.re);
    if (!m) continue;
    const end = m.index + m[0].length;
    if (!best || end > best.end || (end === best.end && p.prio > best.prio))
      best = { id:p.id, end, prio:p.prio };
  }
  return best ? best.id : null;
}

function detectActor(clause, speakers){
  const t = nfc(clause);
  for (const s of speakers){
    const re = new RegExp('(?:^|[\\s,])' + s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*(?:가|는|이|씨|님|은)');
    if (re.test(t)) return s;
  }
  return null;
}

/*
 * 문맥 이어붙이기. 절을 따로 뜯으면 "거기서 그걸 꺼냈다" 같은 절은 슬롯이 텅 빈다.
 * 앞선 원자에서 끌어오되 반드시 inherited 에 남겨, 화면에서 추론임을 드러내고
 * 모순 판정에서도 가중치를 깎는다. 진술자가 하지 않은 말을 조용히 채우면 안 된다.
 */
function linkContext(atoms){
  let curLoc = '', curEnt = '', curActor = '', curSent = null;
  atoms.forEach(a => {
    a.inherited = [];
    const sameSentence = (a.parentSentenceId === curSent);

    // 장소. 상태·목격 진술의 장소는 물건이나 남이 있던 곳이므로
    // 화자의 현재 위치로 이어받으면 안 된다.
    const speakerPlace = (a.kind === 'action' || a.kind === 'denial');
    // 입·퇴실은 그 자체로 출입구를 함의하므로 앞 장소를 끌어오지 않는다.
    const carries = speakerPlace && a.predicate !== '입실' && a.predicate !== '퇴실';

    if (a.locationId) { if (speakerPlace) curLoc = a.locationId; }
    else if (curLoc && PRON_LOC.test(a.quote)) {
      a.locationId = curLoc; a.inherited.push('locationId');
    } else if (curLoc && sameSentence && carries) {
      a.locationId = curLoc; a.inherited.push('locationId');
    }

    // 대상 — 지시어가 있을 때만. 생략 목적어를 넘겨받으면
    // "봉투를 닫았다" 같은 없는 진술이 만들어진다.
    if (a.entityId) curEnt = a.entityId;
    else if (curEnt && PRON_ENT.test(a.quote)) {
      a.entityId = curEnt; a.inherited.push('entityId');
    }

    // 행위자 — 지시어가 앞서 언급된 사람을 가리킬 때
    if (a.actorId) curActor = a.actorId;
    else if (curActor && PRON_PER.test(a.quote)) {
      a.actorId = curActor; a.kind = 'observation'; a.inherited.push('actorId');
    }

    curSent = a.parentSentenceId;
  });
  return atoms;
}

/*
 * 서술 순서를 전체 타임라인의 구간에 얹는다. 초를 지어내지 않고도 R4·R6·R9 가 돌게
 * 하는 최소 장치이며, 배치가 틀리면 화면에서 구간을 바꾸면 된다.
 */
function assignPhases(atoms, phases){
  const P = (phases && phases.length) ? phases : PHASE_SEED;
  const mid = P.length > 2 ? P.slice(1, P.length - 1) : P;
  const body = atoms.filter(a => a.predicate !== '입실' && a.predicate !== '퇴실');
  atoms.forEach((a, i) => { a.seq = i; });
  body.forEach((a, i) => {
    const k = body.length <= 1 ? 0 : Math.floor(i * mid.length / body.length);
    a.phase = mid[Math.min(k, mid.length - 1)] || P[0];
  });
  atoms.forEach(a => {
    if (a.predicate === '입실') a.phase = P[0];
    if (a.predicate === '퇴실') a.phase = P[P.length - 1];
  });
  return atoms;
}

// 구버전 데이터에만 있는 초를 구간으로 옮겨 적는다
function phaseFromSec(c, duration, phases){
  const P = (phases && phases.length) ? phases : PHASE_SEED;
  if (!hasTime(c)) return '';
  const k = Math.floor((c.startSec + c.endSec) / 2 / Math.max(1, duration) * P.length);
  return P[Math.min(P.length - 1, Math.max(0, k))];
}

function atomize(text, ctx){
  const tree = ctx.locations, reg = ctx.entities;
  const speakers = (ctx.speakers || []).filter(s => s !== ctx.speaker);
  const out = [];
  splitSentences(text).forEach((sent, si) => {
    const sid = 'S' + (si + 1);
    // 시간 표현은 절이 갈라지면서 다른 조각으로 떨어져 나가므로 문장 단위로 잡는다
    const sentTime = (sent.match(RE_TIME) || [''])[0];
    splitClauses(sent).forEach(cl => {
      const predicate = detectPredicate(cl);
      const loc = resolveLocation(cl, tree);
      const ent = resolveEntity(cl, reg);
      const actor = detectActor(cl, speakers);
      if (!predicate && !loc && !ent) return;             // 정보 없는 절은 버린다

      let polarity = 'yes';
      if (predicate !== '부재' && RE_NEG.test(cl)) polarity = 'no';

      let kind;
      if (actor) kind = 'observation';
      else if (predicate && STATEP.has(predicate)) kind = 'state';
      else if (polarity === 'no') kind = 'denial';
      else kind = 'action';

      const tm = cl.match(RE_TIME);
      out.push({
        timeHint: tm ? tm[0] : sentTime,
        id: null, speaker: ctx.speaker, round: ctx.round, parentSentenceId: sid,
        phase: '', seq: 0,
        quote: cl, kind, predicate: predicate || '',
        entityId: ent ? ent.id : '', entityText: ent ? ent.surface : '',
        locationId: loc ? loc.id : '', locationText: loc ? loc.surface : '',
        actorId: actor || '',
        startSec: null, endSec: null,
        videoTime: tm ? tm[0] : sentTime,
        polarity,
        modality: RE_HEDGE.test(cl) ? 'hedge' : 'assert',
        scope: kind === 'denial' ? 'session' : 'interval',
        sourceType: ctx.sourceType || 'statement',
        verifiable: false, stateBefore: '', stateAfter: '',
        unresolved: (!ent && /[가-힣]{2,}(?:을|를|이|가)/.test(cl)) ? (cl.match(/([가-힣]{2,})(?:을|를|이|가)/) || [])[1] || '' : ''
      });
    });
  });
  return assignPhases(linkContext(out), ctx.phases);
}

/* ---------------------------------------------------------- 6. 시간 구간 */

function hasTime(c){ return c.startSec != null && c.endSec != null && c.endSec > c.startSec; }

function phaseIndex(p, phases){ return (phases || PHASE_SEED).indexOf(p); }
function samePhase(a, b){ return !!a.phase && a.phase === b.phase; }
function bothPhased(a, b, phases){
  return phaseIndex(a.phase, phases) >= 0 && phaseIndex(b.phase, phases) >= 0;
}

function overlapSec(a, b){
  if (!hasTime(a) || !hasTime(b)) return 0;
  return Math.max(0, Math.min(a.endSec, b.endSec) - Math.max(a.startSec, b.startSec));
}
function overlapRatio(a, b){
  const ov = overlapSec(a, b);
  if (!ov) return 0;
  return ov / Math.min(a.endSec - a.startSec, b.endSec - b.startSec);
}
// detectConflicts 안에서만 쓰이는 현재 사건의 구간 목록
let PHASES = PHASE_SEED;

// 초가 있으면 초로, 없으면 구간으로 견준다. 둘 다 없으면 판단을 보류하고 비교는 해 둔다.
function comparable(a, b){
  if (a.scope === 'session' || b.scope === 'session') return true;
  if (hasTime(a) && hasTime(b)) return overlapSec(a, b) > 0;
  if (bothPhased(a, b, PHASES)) return samePhase(a, b);
  return true;
}
function timeWeight(a, b){
  if (a.scope === 'session' || b.scope === 'session') return 1;
  if (hasTime(a) && hasTime(b)) return Math.max(0.25, overlapRatio(a, b));
  if (bothPhased(a, b, PHASES)) return samePhase(a, b) ? 0.85 : 0;  // 구간은 초보다 거칠다
  return 0.6;                                                       // 시간 정보 자체가 없음
}

function mergeIntervals(list){
  const iv = list.filter(hasTime).map(c => [c.startSec, c.endSec]).sort((x,y) => x[0]-y[0]);
  const out = [];
  for (const cur of iv){
    const last = out[out.length - 1];
    if (last && cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);
    else out.push([cur[0], cur[1]]);
  }
  return out;
}
function coverage(list, duration){
  const merged = mergeIntervals(list);
  const covered = merged.reduce((s, x) => s + (x[1] - x[0]), 0);
  return { covered, gap: Math.max(0, duration - covered), merged };
}

/* ------------------------------------------------------------- 7. 규칙 */

const BASE = { R1a:1.0, R1b:1.0, R2:1.0, R3:1.0, R4:0.9, R5:0.5, R6:0.5, R9:0.7 };

function assertsPresence(c){
  return (c.kind === 'action') && c.locationId && PRESENCE.has(c.predicate) && c.polarity === 'yes';
}
function deniesPresence(c){
  return (c.kind === 'denial') && c.locationId && c.polarity === 'no' &&
         (MOVEMENT.has(c.predicate) || !c.predicate);
}

// blame — 이 모순의 책임을 화자별로 얼마나 지울지. 목격자를 목격했다는 이유로
// 깎지 않기 위해 필요하다. 기본은 양쪽 동일.
function mk(rule, a, b, why, tree, extra){
  const evidence = a.sourceType === 'evidence' || b.sourceType === 'evidence';
  let sev = BASE[rule] * timeWeight(a, b) * (evidence ? 2 : 1);
  if (a.modality === 'hedge' || b.modality === 'hedge') sev *= 0.6;
  // 문맥에서 끌어온 슬롯 위에 세운 판정은 진술자가 직접 말한 것보다 약하게 잡는다
  const inferred = (a.inherited && a.inherited.length) || (b.inherited && b.inherited.length);
  if (inferred) sev *= 0.7;
  sev = Math.round(sev * 100) / 100;
  const blame = {}; blame[a.speaker] = 1; blame[b.speaker] = 1;
  return Object.assign({
    rule: evidence ? rule + '/R7' : rule,
    severity: sev >= 0.8 ? 'hard' : sev >= 0.4 ? 'medium' : 'soft',
    sev, a, b, why, blame,
    speakers: Array.from(new Set([a.speaker, b.speaker])).sort()
  }, extra || {});
}

function detectConflicts(claims, model){
  const tree = model.locations, dur = model.duration;
  PHASES = (model.phases && model.phases.length) ? model.phases : PHASE_SEED;
  const cs = claims.filter(c => c.approved !== false);
  const found = [], seen = new Set(), pairSeen = new Set();
  const pairKey = c => [c.a.id, c.b.id].sort().join('|');
  const push = c => {
    const k = c.rule + '|' + pairKey(c);
    if (seen.has(k)) return;
    seen.add(k); pairSeen.add(pairKey(c)); found.push(c);
  };

  for (let i = 0; i < cs.length; i++){
    for (let j = i + 1; j < cs.length; j++){
      const a = cs[i], b = cs[j];
      const same = a.speaker === b.speaker;
      if (!comparable(a, b)) continue;

      /* R1a 자기 위치 모순 — 술어가 달라도 '그 구역에 있었는가'로 비교한다 */
      if (same){
        const pairs = [[a,b],[b,a]];
        for (const [x,y] of pairs){
          if (deniesPresence(x) && assertsPresence(y) && sameZone(x.locationId, y.locationId, tree)){
            push(mk('R1a', x, y,
              (tree[x.locationId] ? tree[x.locationId].name : x.locationId) +
              ' 구역에 대해 한쪽은 부인, 한쪽은 그 구역에서의 행위를 진술합니다.', tree));
          }
        }
      }

      /* R1b 자기 극성 반전 — 같은 술어·같은 대상에 대한 예/아니오 뒤집힘 */
      if (same && a.predicate && a.predicate === b.predicate && a.polarity !== b.polarity){
        const target = (a.entityId && a.entityId === b.entityId) ? 'entity'
                     : (sameZone(a.locationId, b.locationId, tree) ? 'zone' : null);
        if (target) push(mk('R1b', a, b, '동일한 대상에 대한 ‘' + a.predicate + '’ 진술의 극성이 뒤집혔습니다.', tree));
      }

      /* R4 물리 불가 — 같은 사람이 한 시점에 서로 떨어진 구역에.
         초가 있으면 실제 겹침을, 없으면 같은 구간을 근거로 삼는다. 구간은 거칠어서
         그 안에서 걸어 이동했을 수 있으므로 심각도가 저절로 낮게 잡힌다. */
      if (same && assertsPresence(a) && assertsPresence(b) &&
          disjointZone(a.locationId, b.locationId, tree) &&
          ((hasTime(a) && hasTime(b) && overlapSec(a, b) >= 5) ||
           (!hasTime(a) && !hasTime(b) && bothPhased(a, b, PHASES) && samePhase(a, b)))){
        push(mk('R4', a, b, (hasTime(a) ? '겹치는 시각' : '같은 구간(' + a.phase + ')') +
          '에 서로 떨어진 두 구역에 있었다고 진술합니다.', tree));
      }

      /* R2 교차 화자 위치 모순 — 같은 물건을 서로 다른 구역에 둔다 */
      if (!same && a.kind === 'state' && b.kind === 'state' &&
          a.polarity === 'yes' && b.polarity === 'yes' &&
          a.entityId && a.entityId === b.entityId &&
          disjointZone(a.locationId, b.locationId, tree)){
        push(mk('R2', a, b,
          '같은 대상의 위치를 서로 다르게 진술합니다: ' +
          (tree[a.locationId] ? tree[a.locationId].name : a.locationId) + ' ↔ ' +
          (tree[b.locationId] ? tree[b.locationId].name : b.locationId), tree));
      }

      /* R3 교차 화자 행위 모순 — 목격 진술 대 당사자 진술 */
      if (!same){
        const pairs = [[a,b],[b,a]];
        for (const [obs, own] of pairs){
          if (obs.kind !== 'observation' || obs.actorId !== own.speaker || obs.polarity !== 'yes') continue;

          // 목격한 쪽이 아니라 지목당한 쪽에 책임을 싣는다
          const witnessBlame = c => { c.blame[obs.speaker] = 0.3; c.blame[own.speaker] = 1; return c; };

          if (obs.locationId && deniesPresence(own) && sameZone(obs.locationId, own.locationId, tree)){
            push(witnessBlame(mk('R3', obs, own,
              obs.speaker + '는 ' + own.speaker + '가 그 구역에 있었다고 진술하지만 본인은 부인합니다.', tree)));
          }
          if (obs.locationId && assertsPresence(own) &&
              disjointZone(obs.locationId, own.locationId, tree) &&
              ((hasTime(obs) && hasTime(own) && overlapSec(obs, own) >= 5) ||
               (!hasTime(obs) && !hasTime(own) && bothPhased(obs, own, PHASES) && samePhase(obs, own)))){
            push(witnessBlame(mk('R3', obs, own,
              '같은 시각에 대해 목격 위치와 본인 진술 위치가 서로 떨어져 있습니다.', tree)));
          }
          if (obs.predicate && obs.predicate === own.predicate &&
              obs.entityId && obs.entityId === own.entityId && own.polarity === 'no'){
            push(witnessBlame(mk('R3', obs, own,
              '‘' + obs.predicate + '’ 행위에 대해 목격과 본인 진술이 반대입니다.', tree)));
          }
        }
      }
    }
  }

  /* R2 다수결 책임 배분 — 같은 물건에 대해 다수가 합의한 위치를 말한 화자는 덜 깎는다 */
  const r2 = found.filter(c => c.rule.indexOf('R2') === 0);
  if (r2.length){
    const tally = {};   // entityId -> locationId -> Set(speaker)
    cs.filter(c => c.kind === 'state' && c.polarity === 'yes' && c.entityId && c.locationId)
      .forEach(c => {
        const t = tally[c.entityId] = tally[c.entityId] || {};
        (t[c.locationId] = t[c.locationId] || new Set()).add(c.speaker);
      });
    r2.forEach(c => {
      const t = tally[c.a.entityId] || {};
      const size = l => (t[l] ? t[l].size : 0);
      const top = Math.max.apply(null, Object.keys(t).map(size).concat([0]));
      [c.a, c.b].forEach(x => { c.blame[x.speaker] = size(x.locationId) >= top && top > 1 ? 0.3 : 1; });
    });
  }

  /* R5 상태 전이 위반 */
  const byEntity = {};
  cs.filter(c => c.entityId && (c.stateBefore || c.stateAfter))
    .forEach(c => { (byEntity[c.entityId] = byEntity[c.entityId] || []).push(c); });
  for (const eid in byEntity){
    const seq = byEntity[eid].slice().sort((x,y) => (x.startSec ?? 0) - (y.startSec ?? 0));
    for (let i = 0; i < seq.length - 1; i++){
      const cur = seq[i], nxt = seq[i+1];
      if (cur.stateAfter && nxt.stateBefore && normKo(cur.stateAfter) !== normKo(nxt.stateBefore)){
        found.push(mk('R5', cur, nxt,
          '‘' + cur.stateAfter + '’ 이후 ‘' + nxt.stateBefore + '’ 로 바뀌는 과정이 진술되지 않았습니다.', tree));
      }
    }
  }

  /* R9 순서 모순 — 같은 사건을 서로 다른 구간에 놓는다.
     초가 없어도 도는 규칙이라 붙여넣기만 한 진술에서도 동작한다.
     한 사람이 한 회차에 같은 행위를 여러 번 말할 수 있으므로
     (문 여러 번 드나들기) 회차·화자별 첫 등장만 견준다. */
  const firstByKey = {};
  // 세션 전체를 뜻하는 진술은 특정 구간에 속하지 않으므로 순서를 따지지 않는다
  cs.filter(c => c.polarity === 'yes' && c.scope !== 'session' &&
                 phaseIndex(c.phase, PHASES) >= 0).forEach(c => {
    const key = (c.predicate || '?') + '·' + (c.entityId || c.locationId || '?');
    const owner = c.speaker + '#' + c.round;
    const slot = firstByKey[key] = firstByKey[key] || {};
    if (!slot[owner]) slot[owner] = c;
  });
  for (const key in firstByKey){
    const list = Object.keys(firstByKey[key]).map(k => firstByKey[key][k]);
    for (let i = 0; i < list.length; i++){
      for (let j = i + 1; j < list.length; j++){
        const x = list[i], y = list[j];
        if (x.phase === y.phase) continue;
        // 위치나 행위 모순으로 이미 잡힌 쌍이면 같은 불일치를 두 번 세지 않는다
        if (pairSeen.has([x.id, y.id].sort().join('|'))) continue;
        push(mk('R9', x, y,
          '같은 사건을 서로 다른 구간에 놓습니다: ' + x.phase + ' ↔ ' + y.phase, tree));
      }
    }
  }

  /* R6 설명되지 않은 구간 — 초가 있으면 초로, 없으면 구간 단위로 센다 */
  const bySpeaker = {};
  cs.forEach(c => { (bySpeaker[c.speaker] = bySpeaker[c.speaker] || []).push(c); });
  const gaps = {};
  for (const sp in bySpeaker){
    const mine = bySpeaker[sp];
    const timed = mine.filter(hasTime);

    if (timed.length){
      const cov = coverage(timed, dur);
      gaps[sp] = cov.gap;
      if (cov.gap > 0){
        found.push({
          rule:'R6', severity: cov.gap > 60 ? 'hard' : 'medium',
          sev: Math.round(Math.min(1, cov.gap / Math.max(1, dur) * 3) * 100) / 100,
          a: timed[0], b: timed[timed.length - 1], speakers:[sp],
          why: dur + '초 중 ' + cov.gap + '초가 어떤 진술로도 채워지지 않았습니다.',
          gapOnly: true
        });
      }
      continue;
    }

    gaps[sp] = 0;
    const filled = new Set(mine.map(c => c.phase).filter(p => phaseIndex(p, PHASES) >= 0));
    if (!filled.size) continue;                       // 구간 배치 자체가 안 된 화자는 넘어간다
    const missing = PHASES.filter(p => !filled.has(p));
    if (missing.length){
      found.push({
        rule:'R6', severity: missing.length > 1 ? 'medium' : 'soft',
        sev: Math.round(Math.min(1, missing.length / PHASES.length * 2) * 100) / 100,
        a: mine[0], b: mine[mine.length - 1], speakers:[sp],
        why: '설명이 없는 구간: ' + missing.join(' · '),
        gapOnly: true, missingPhases: missing
      });
    }
  }

  found.sort((x, y) => y.sev - x.sev);
  return { conflicts: found, gaps };
}

/* ------------------------------------------------------------- 8. 점수 */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;

function keyOf(c){ return (c.predicate || '?') + '·' + (c.entityId || c.locationId || '?'); }

function unity(claims){
  const r1c = claims.filter(c => c.round === 1);
  const r2c = claims.filter(c => c.round > 1);
  const m1 = new Map(); r1c.forEach(c => m1.set(keyOf(c), c));
  let reversed = 0, added = 0;
  const ev = [];
  r2c.forEach(c => {
    const p = m1.get(keyOf(c));
    if (!p) { added++; ev.push(c.id); }
    else if (p.polarity !== c.polarity) { reversed++; ev.push(c.id, p.id); }
  });
  const total = Math.max(1, m1.size + added);
  return { score: clamp(100 - 100 * (reversed * 2 + added * 0.5) / total, 0, 100),
           reversed, added, evidence: ev };
}

function scoreSpeaker(sp, claims, conflicts, model){
  const mine = claims.filter(c => c.speaker === sp && c.approved !== false);
  const n = Math.max(1, mine.length);
  const dur = model.duration;

  // 객관성 — 추측·전언의 비율
  const hedge = mine.filter(c => c.modality === 'hedge').length / n;
  const infer = mine.filter(c => c.kind === 'observation' && c.modality === 'hedge').length / n;
  const O = clamp(100 * (1 - hedge * 0.6 - infer * 0.4), 0, 100);

  // 일관성 — 내부 모순의 심각도 합
  const internal = conflicts.filter(c => !c.gapOnly && c.speakers.length === 1 && c.speakers[0] === sp);
  const iSum = internal.reduce((s, c) => s + c.sev, 0);
  const C = clamp(100 * Math.exp(-iSum / 3), 0, 100);

  // 통일성 — 회차 간 유지율 (가장 무겁게 본다)
  const U = unity(mine);

  // 구체성 — 슬롯 충족 · 검증 가능성 · 시간 정밀도
  const slotFill = mine.reduce((s, c) => {
    let f = 0;
    if (c.predicate) f++; if (c.entityId) f++; if (c.locationId) f++;
    if (hasTime(c) || c.phase) f++; if (c.quote) f++;
    return s + f / 5;
  }, 0) / n;
  const verif = mine.filter(c => c.verifiable).length / n;
  const timed = mine.filter(hasTime);
  const meanLen = timed.length ? timed.reduce((s,c) => s + (c.endSec - c.startSec), 0) / timed.length : dur;
  const prec = clamp(1 - meanLen / Math.max(1, dur), 0, 1) * (timed.length / n);
  const S = clamp(100 * (slotFill * 0.4 + verif * 0.3 + prec * 0.3), 0, 100);

  // 개연성 — 타 화자·물증과의 충돌
  const cross = conflicts.filter(c => !c.gapOnly && c.speakers.length > 1 && c.speakers.indexOf(sp) >= 0);
  const phys  = internal.filter(c => c.rule.indexOf('R4') === 0);
  const blameOf = c => (c.blame && c.blame[sp] != null) ? c.blame[sp] : 1;
  const xSum = cross.reduce((s, c) => s + c.sev * blameOf(c), 0)
             + phys.reduce((s, c) => s + c.sev * 0.5, 0);
  const P = clamp(100 * Math.exp(-xSum / 2.5), 0, 100);

  const gapSec = (model.gaps && model.gaps[sp]) || 0;
  const gapPen = clamp(100 * gapSec / Math.max(1, dur), 0, 100);

  const raw = 2.0 * (100 - U.score) + 1.5 * (100 - C) + 1.5 * (100 - P)
            + 1.0 * gapPen + 1.0 * (100 - S) + 0.5 * (100 - O);
  const suspicion = clamp(raw / 8.5, 0, 100);

  const evidence = conflicts
    .filter(c => c.speakers.indexOf(sp) >= 0 && (c.gapOnly || blameOf(c) >= 0.5))
    .sort((x, y) => y.sev * (y.gapOnly ? 1 : blameOf(y)) - x.sev * (x.gapOnly ? 1 : blameOf(x)))
    .slice(0, 3)
    .map(c => c.gapOnly ? c.rule + ' ' + c.why : c.rule + ' ' + c.a.id + '↔' + c.b.id);

  return {
    speaker: sp, n: mine.length,
    stage1: { objectivity: r1(O), consistency: r1(C), unity: r1(U.score) },
    stage2: { specificity: r1(S), plausibility: r1(P) },
    gapSec, reversed: U.reversed, added: U.added,
    hard: conflicts.filter(c => c.severity === 'hard' && c.speakers.indexOf(sp) >= 0).length,
    suspicion: r1(suspicion),
    evidence
  };
}

function analyze(claims, model){
  const m = Object.assign({ locations: LOCATION_SEED, entities: ENTITY_SEED,
                            duration: 300, phases: PHASE_SEED }, model || {});
  const det = detectConflicts(claims, m);
  m.gaps = det.gaps;
  const speakers = Array.from(new Set(claims.map(c => c.speaker))).sort();
  const scores = speakers.map(sp => scoreSpeaker(sp, claims, det.conflicts, m));
  scores.sort((a, b) => b.suspicion - a.suspicion);
  return { conflicts: det.conflicts, gaps: det.gaps, scores, speakers };
}

/* ---------------------------------------------- 9. 구버전 JSON 하위 호환 */

function upgradeClaim(c, model){
  // 이미 신형이어도 구간·순서는 비어 있을 수 있으므로 그것만 채워 준다
  if (c.kind && c.predicate !== undefined){
    return Object.assign({}, c, {
      phase: c.phase || phaseFromSec(c, model.duration || 300, model.phases),
      seq: c.seq == null ? 0 : c.seq,
      inherited: c.inherited || []
    });
  }
  const tree = model.locations, reg = model.entities;
  const src = [c.action, c.object, c.location, c.quote].filter(Boolean).join(' ');
  const predicate = detectPredicate(c.action || c.quote || '') || detectPredicate(src) || '';
  const loc = c.location ? resolveLocation(c.location, tree) : resolveLocation(c.quote || '', tree);
  const ent = c.object ? resolveEntity(c.object, reg) : resolveEntity(c.quote || '', reg);
  const polarity = c.polarity || 'yes';
  let kind;
  if (STATEP.has(predicate)) kind = 'state';
  else if (polarity === 'no') kind = 'denial';
  else kind = 'action';
  return Object.assign({}, c, {
    kind, predicate,
    entityId: ent ? ent.id : '', entityText: c.object || (ent ? ent.surface : ''),
    locationId: loc ? loc.id : '', locationText: c.location || (loc ? loc.surface : ''),
    actorId: '', modality: RE_HEDGE.test(c.quote || '') ? 'hedge' : 'assert',
    scope: kind === 'denial' ? 'session' : 'interval',
    startSec: c.startSec ?? null, endSec: c.endSec ?? null,
    phase: c.phase || phaseFromSec(c, model.duration || 300, model.phases),
    seq: c.seq == null ? 0 : c.seq, inherited: c.inherited || [],
    parentSentenceId: c.parentSentenceId || ''
  });
}

/* ------------------------------------------------------------ 10. 자가검증 */

function selftest(){
  const T = [];
  const ok = (name, cond) => T.push({ name, pass: !!cond });
  const M = { locations: LOCATION_SEED, entities: ENTITY_SEED, duration: 300 };
  const C = (o, i) => Object.assign({
    id:'X'+i, speaker:'A', round:1, quote:'', kind:'action', predicate:'', entityId:'',
    locationId:'', actorId:'', startSec:null, endSec:null, polarity:'yes',
    modality:'assert', scope:'interval', sourceType:'statement', verifiable:false,
    stateBefore:'', stateAfter:'', approved:true
  }, o);

  // 정규화 4
  ok('normKo 조사·어미 절단', normKo('책상 쪽에는') === '책상 쪽' && normKo('갔습니다') === '갔');
  ok('위치 최장일치', resolveLocation('책상 서랍을 열었다', LOCATION_SEED).id === 'L_DRAWER');
  ok('개체 별칭 병합', resolveEntity('봉투를 봤다', ENTITY_SEED).id === 'E_MONEY');
  ok('구역 포함관계', sameZone('L_DRAWER','L_DESK',LOCATION_SEED) && disjointZone('L_WINDOW','L_DESK',LOCATION_SEED));

  // 절 분해 + 서술어 위치 우선
  const AT = t => atomize(t, { speaker:'A', round:1, locations:LOCATION_SEED,
                               entities:ENTITY_SEED, speakers:['A','B','C'] });

  const at = AT('책상 옆에서 잠깐 가방을 정리한 다음 창가로 갔습니다.');
  ok('절 분해로 원자 2개', at.length === 2 && at[0].locationId === 'L_DESK' && at[1].locationId === 'L_WINDOW');
  ok('서술어는 뒤쪽 우선', detectPredicate('나오기 직전에 의자를 원래 위치로 밀었습니다') === '정리');

  // -어서/-가서 연결 — 이전에는 두 행위가 한 원자로 뭉개졌다
  const at2 = AT('교수님 책상 쪽으로 가서 서랍을 열었어요.');
  ok('-가서 에서 절 분해', at2.length === 2 &&
     at2[0].predicate === '이동' && at2[1].predicate === '개폐');

  // 접속 부사를 잘라내도 본문이 깨지지 않아야 한다 ('에 창가로' 같은 잔해 금지)
  const at3 = AT('그 다음에 창가로 가서 충전기를 챙겼고요.');
  ok('접속 부사 제거 시 본문 보존', at3.length === 2 && at3[0].quote.indexOf('창가로') === 0);

  // 입실·퇴실이 '갔/왔' 에 먹히지 않아야 한다
  ok('입실 판정', detectPredicate('연구실에 들어갔습니다') === '입실');
  ok('퇴실 판정', detectPredicate('그대로 나왔습니다') === '퇴실');
  ok('연결어미 오탐 없음', detectPredicate('저는 5분쯤 있다가') !== '접근');

  // 지시어 해소
  const at4 = AT('서랍을 열었어요. 거기 봉투가 있길래 그냥 닫았습니다.');
  const seen = at4.find(c => c.entityId === 'E_MONEY');
  ok('지시어 “거기” 로 장소 상속', seen && seen.locationId === 'L_DRAWER' &&
     seen.inherited.indexOf('locationId') >= 0);
  ok('“있길래” 를 상태 진술로', seen && seen.kind === 'state' && seen.predicate === '목격');

  // 목격한 남의 위치를 화자 위치로 이어받으면 안 된다
  const at5 = AT('B는 소파에 앉아 있었습니다. 저는 그대로 나왔습니다.');
  const exit = at5.find(c => c.predicate === '퇴실');
  ok('목격 위치는 화자 위치로 새지 않음', exit && exit.locationId !== 'L_SOFA');

  // 시간 표현이 다른 절로 떨어져 나가도 문장 단위로 붙잡는다
  const at6 = AT('저는 5분쯤 있다가 나왔습니다.');
  ok('시간 힌트 문장 단위 보존', at6.length && at6[at6.length - 1].timeHint === '5분');

  // 추측 표현
  const at7 = AT('걔가 그걸 가져갔을 수도 있어요.');
  ok('추측 표현 검출', at7.length && at7[0].modality === 'hedge');
  ok('인칭 지시어로 행위자 상속', (() => {
    const a = AT('B는 소파에 앉아 있었습니다. 걔가 그걸 가져갔어요.');
    const last = a[a.length - 1];
    return last.actorId === 'B' && last.inherited.indexOf('actorId') >= 0;
  })());

  // R1a
  let r = detectConflicts([
    C({ id:'a1', kind:'denial', predicate:'이동', locationId:'L_DESK', polarity:'no', scope:'session' },1),
    C({ id:'a2', kind:'action', predicate:'정리', locationId:'L_DESK', startSec:70, endSec:120 },2)
  ], M);
  ok('R1a 자기 위치 모순', r.conflicts.some(c => c.rule.indexOf('R1a') === 0));

  // R1b
  r = detectConflicts([
    C({ id:'b1', predicate:'접촉', entityId:'E_DRAWER', polarity:'yes', scope:'session' },1),
    C({ id:'b2', kind:'denial', predicate:'접촉', entityId:'E_DRAWER', polarity:'no', scope:'session' },2)
  ], M);
  ok('R1b 극성 반전', r.conflicts.some(c => c.rule.indexOf('R1b') === 0));

  // R2 — 이번 재구축의 핵심
  r = detectConflicts([
    C({ id:'m1', speaker:'A', kind:'state', predicate:'목격', entityId:'E_MONEY', locationId:'L_DRAWER', scope:'session' },1),
    C({ id:'m2', speaker:'B', kind:'state', predicate:'목격', entityId:'E_MONEY', locationId:'L_DESKTOP', scope:'session' },2),
    C({ id:'m3', speaker:'C', kind:'state', predicate:'목격', entityId:'E_MONEY', locationId:'L_SOFA',    scope:'session' },3)
  ], M);
  ok('R2 교차 화자 위치 모순 3쌍', r.conflicts.filter(c => c.rule.indexOf('R2') === 0).length === 3);

  // R3
  r = detectConflicts([
    C({ id:'o1', speaker:'C', kind:'observation', actorId:'B', predicate:'접근', locationId:'L_DESK', scope:'session' },1),
    C({ id:'o2', speaker:'B', kind:'denial', predicate:'이동', locationId:'L_DESK', polarity:'no', scope:'session' },2)
  ], M);
  ok('R3 목격 대 부인', r.conflicts.some(c => c.rule.indexOf('R3') === 0));

  // R4
  r = detectConflicts([
    C({ id:'p1', predicate:'확인', locationId:'L_WINDOW', startSec:60, endSec:120 },1),
    C({ id:'p2', predicate:'접촉', locationId:'L_DESK',   startSec:90, endSec:150 },2)
  ], M);
  ok('R4 물리 불가', r.conflicts.some(c => c.rule.indexOf('R4') === 0));

  // R5
  r = detectConflicts([
    C({ id:'s1', predicate:'개폐', entityId:'E_BOX', startSec:10, endSec:20, stateBefore:'상자 열림', stateAfter:'상자 닫힘' },1),
    C({ id:'s2', predicate:'확인', entityId:'E_BOX', startSec:40, endSec:50, stateBefore:'상자 열림', stateAfter:'상자 닫힘' },2)
  ], M);
  ok('R5 상태 전이 위반', r.conflicts.some(c => c.rule === 'R5'));

  // R6 — 데모 JSON 의 B 와 같은 값(50초)이 나와야 한다
  r = detectConflicts([
    C({ speaker:'B', id:'g1', startSec:0,   endSec:50  },1),
    C({ speaker:'B', id:'g2', startSec:50,  endSec:130 },2),
    C({ speaker:'B', id:'g3', startSec:130, endSec:205 },3),
    C({ speaker:'B', id:'g4', startSec:255, endSec:300 },4),
    C({ speaker:'B', id:'g5', startSec:70,  endSec:120 },5),
    C({ speaker:'B', id:'g6', startSec:95,  endSec:115 },6)
  ], M);
  ok('R6 미설명 50초 회귀', r.gaps.B === 50);

  // 구간 배치 — 입·퇴실은 타임라인 양 끝에 고정된다
  const ph = assignPhases(AT('연구실에 들어갔습니다. 창가로 갔습니다. 상자를 확인했습니다. 그대로 나왔습니다.'), PHASE_SEED);
  ok('입·퇴실은 타임라인 양 끝', ph[0].phase === PHASE_SEED[0] &&
     ph[ph.length - 1].phase === PHASE_SEED[PHASE_SEED.length - 1]);
  ok('나머지는 서술 순서대로 배치', ph.every(c => PHASE_SEED.indexOf(c.phase) >= 0) &&
     ph.every((c, i) => i === 0 || PHASE_SEED.indexOf(c.phase) >= PHASE_SEED.indexOf(ph[i-1].phase)));

  // R9 교차 화자 순서 모순 — 초가 없어도 돈다
  r = detectConflicts([
    C({ id:'q1', speaker:'A', predicate:'개폐', entityId:'E_DRAWER', locationId:'L_DRAWER', phase:'초반' },1),
    C({ id:'q2', speaker:'B', predicate:'개폐', entityId:'E_DRAWER', locationId:'L_DRAWER', phase:'후반' },2)
  ], M);
  ok('R9 교차 화자 순서 모순', r.conflicts.some(c => c.rule.indexOf('R9') === 0));

  // R9 회차 간 사건 이동
  r = detectConflicts([
    C({ id:'w1', speaker:'A', round:1, predicate:'획득', entityId:'E_FILE', locationId:'L_SHELF', phase:'초반' },1),
    C({ id:'w2', speaker:'A', round:2, predicate:'획득', entityId:'E_FILE', locationId:'L_SHELF', phase:'후반' },2)
  ], M);
  ok('R9 회차 간 사건 이동', r.conflicts.some(c => c.rule.indexOf('R9') === 0));

  // 같은 사건을 여러 번 말하는 것 자체는 모순이 아니다
  r = detectConflicts([
    C({ id:'w3', speaker:'A', round:1, predicate:'이동', locationId:'L_DOOR', phase:'입실' },1),
    C({ id:'w4', speaker:'A', round:1, predicate:'이동', locationId:'L_DOOR', phase:'퇴실' },2)
  ], M);
  ok('한 회차 안 반복은 R9 아님', !r.conflicts.some(c => c.rule.indexOf('R9') === 0));

  // 세션 전체 진술은 특정 구간에 속하지 않는다
  r = detectConflicts([
    C({ id:'w5', speaker:'A', predicate:'목격', entityId:'E_MONEY', locationId:'L_DRAWER', phase:'초반', scope:'session' },1),
    C({ id:'w6', speaker:'B', predicate:'목격', entityId:'E_MONEY', locationId:'L_DRAWER', phase:'후반', scope:'session' },2)
  ], M);
  ok('세션 진술은 R9 제외', !r.conflicts.some(c => c.rule.indexOf('R9') === 0));

  // R4 초 없이 구간만으로
  r = detectConflicts([
    C({ id:'v1', predicate:'확인', locationId:'L_WINDOW', phase:'중반' },1),
    C({ id:'v2', predicate:'접촉', locationId:'L_DESK',   phase:'중반' },2)
  ], M);
  ok('R4 구간 기반 판정', r.conflicts.some(c => c.rule.indexOf('R4') === 0 && c.severity !== 'hard'));

  // R6 구간 공백
  r = detectConflicts([
    C({ speaker:'D', id:'u1', predicate:'입실', locationId:'L_DOOR', phase:'입실' },1),
    C({ speaker:'D', id:'u2', predicate:'확인', locationId:'L_CHAIR', phase:'초반' },2)
  ], M);
  ok('R6 설명 없는 구간', r.conflicts.some(c => c.rule === 'R6' && (c.missingPhases || []).length === 3));

  // R7 물증 가중
  r = detectConflicts([
    C({ id:'e1', kind:'denial', predicate:'이동', locationId:'L_DESK', polarity:'no', scope:'session' },1),
    C({ id:'e2', kind:'action', predicate:'접근', locationId:'L_DESK', scope:'session', sourceType:'evidence' },2)
  ], M);
  ok('R7 물증 가중 2배', r.conflicts.some(c => c.rule.indexOf('/R7') > 0 && c.sev >= 1.9));

  const pass = T.filter(t => t.pass).length;
  T.forEach(t => console.log((t.pass ? 'PASS  ' : 'FAIL  ') + t.name));
  console.log(pass + '/' + T.length + ' passed');
  return { pass, total: T.length, results: T };
}

root.FT = {
  LOCATION_SEED, ENTITY_SEED, PHASE_SEED, PREDICATES, PRESENCE, STATEP,
  assignPhases, phaseFromSec, samePhase, phaseIndex,
  normKo, jaccard, bigrams,
  sameZone, disjointZone, ancestry,
  resolveLocation, resolveEntity, suggestEntities,
  splitSentences, splitClauses, detectPredicate, detectActor, atomize,
  hasTime, overlapSec, overlapRatio, coverage,
  detectConflicts, scoreSpeaker, analyze, upgradeClaim, selftest
};
})(typeof window !== 'undefined' ? window : globalThis);
/* ==FACTTRACE-ENGINE-END== */
</script>

<script>
/* ============================== UI ============================== */
(function () {
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? '' : s);

const KEY = 'facttrace.v2';
const state = {
  claims: [],
  duration: 300,
  phases: FT.PHASE_SEED.slice(),
  locations: JSON.parse(JSON.stringify(FT.LOCATION_SEED)),
  entities: JSON.parse(JSON.stringify(FT.ENTITY_SEED)),
  view: 'ingest',
  seq: 0
};

/* ---- persistence ---- */
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({
    claims: state.claims, duration: state.duration, entities: state.entities,
    phases: state.phases, seq: state.seq
  })); } catch (e) {}
}
function load(){
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return;
    const d = JSON.parse(raw);
    state.claims = d.claims || []; state.duration = d.duration || 300;
    state.entities = d.entities || state.entities; state.seq = d.seq || state.claims.length;
    state.phases = (d.phases && d.phases.length) ? d.phases : state.phases;
  } catch (e) {}
}

function model(){ return { locations: state.locations, entities: state.entities,
                           duration: state.duration, phases: state.phases }; }
function nextId(sp){
  const n = state.claims.filter(c => c.speaker === sp).length + 1;
  return sp + n;
}
function speakers(){ return Array.from(new Set(state.claims.map(c => c.speaker))).sort(); }

/* ---- routing ---- */
function show(v){
  state.view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === v)));
  ['ingest','atoms','timeline','conflict','assess'].forEach(k => { $('#v-' + k).hidden = (k !== v); });
  render();
}

/* ---- render ---- */
let cache = null;
function recompute(){ cache = FT.analyze(state.claims, model()); return cache; }

function render(){
  const a = recompute();
  $('#n-atoms').textContent = state.claims.length;
  $('#n-cf').textContent = a.conflicts.length;
  $('#dl-speakers').innerHTML = speakers().map(s => '<option value="' + esc(s) + '">').join('');
  if (state.view === 'atoms') renderAtoms();
  if (state.view === 'timeline') renderTimeline(a);
  if (state.view === 'conflict') renderConflicts(a);
  if (state.view === 'assess') renderAssess(a);
  save();
}

const OPT = {
  kind: [['action','행위'],['state','상태'],['observation','목격'],['denial','부인']],
  polarity: [['yes','예'],['no','아니오']],
  modality: [['assert','단정'],['hedge','추측']],
  scope: [['interval','구간'],['session','전체']],
  sourceType: [['statement','진술'],['evidence','물증']]
};
function sel(cls, val, pairs, on){
  const s = el('select', cls);
  pairs.forEach(p => {
    const o = el('option', null, p[1]); o.value = p[0];
    if (String(val) === String(p[0])) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = () => on(s.value);
  return s;
}

function renderAtoms(){
  // 사람이 손대야 하는 것부터 세어 보여준다
  const sum = $('#sum'); sum.innerHTML = '';
  const noPhase = state.claims.filter(c => !c.phase).length;
  const inf = state.claims.filter(c => c.inherited && c.inherited.length).length;
  const noSlot = state.claims.filter(c => !c.predicate || (!c.entityId && !c.locationId)).length;
  [['원자', state.claims.length, false],
   ['문맥 추론', inf, inf > 0],
   ['구간 미배치', noPhase, noPhase > 0],
   ['슬롯 미완', noSlot, noSlot > 0]
  ].forEach(x => {
    const d = el('div', 'lbl' + (x[2] ? ' warn' : ''), x[0] + ' ' + x[1]);
    sum.appendChild(d);
  });

  const tray = $('#tray'); tray.innerHTML = '';
  const un = state.claims.filter(c => c.unresolved && !c.entityId);
  if (un.length){
    const box = el('div','tray');
    box.appendChild(el('div','lbl','미해결 개체 ' + un.length));
    un.forEach(c => {
      const r = el('div','r');
      r.appendChild(el('span', null, '“' + c.unresolved + '”'));
      FT.suggestEntities(c.unresolved, state.entities, 3).forEach(s => {
        const b = el('button','ghost', s.canonical + ' ' + Math.round(s.score * 100) + '%');
        b.onclick = () => { c.entityId = s.id; c.entityText = c.unresolved; c.unresolved = ''; render(); };
        r.appendChild(b);
      });
      const nb = el('button','ghost','새 개체');
      nb.onclick = () => {
        const id = 'E_U' + (++state.seq);
        state.entities.push({ id, canonical: c.unresolved, aliases: [c.unresolved] });
        c.entityId = id; c.entityText = c.unresolved; c.unresolved = ''; render();
      };
      const sk = el('button','ghost','건너뜀');
      sk.onclick = () => { c.unresolved = ''; render(); };
      r.appendChild(nb); r.appendChild(sk);
      box.appendChild(r);
    });
    tray.appendChild(box);
  }

  const host = $('#atoms'); host.innerHTML = '';
  if (!state.claims.length){ host.appendChild(el('div','empty','원자가 없습니다.')); return; }

  state.claims.slice().sort((x,y) =>
    x.speaker.localeCompare(y.speaker) || x.round - y.round ||
    ((x.startSec ?? 1e9) - (y.startSec ?? 1e9))
  ).forEach(c => {
    const n = el('div','atom');
    const h = el('div','head');
    h.appendChild(el('span','lbl', c.id + ' · ' + c.speaker + ' · ' + c.round + '차'));
    if (!c.phase) h.appendChild(el('span','lbl warn','구간 미배치'));
    if (c.timeHint) h.appendChild(el('span','lbl','원문 시간 ' + c.timeHint));
    if (c.inherited && c.inherited.length) h.appendChild(el('span','lbl warn','문맥 추론'));
    const del = el('button','del','삭제');
    del.onclick = () => { state.claims = state.claims.filter(x => x !== c); render(); };
    h.appendChild(del);
    n.appendChild(h);
    n.appendChild(el('div','q', c.quote));

    const s = el('div','slots');
    s.appendChild(sel(null, c.kind, OPT.kind, v => { c.kind = v; render(); }));

    const pr = el('select');
    [''].concat(FT.PREDICATES.map(p => p.id)).forEach(p => {
      const o = el('option', null, p || '술어 없음'); o.value = p;
      if (c.predicate === p) o.selected = true; pr.appendChild(o);
    });
    pr.onchange = () => { c.predicate = pr.value; render(); };
    s.appendChild(pr);

    // 문맥에서 끌어온 슬롯은 붉은 점선으로 구분한다. 사람이 손대면 확정으로 바뀐다.
    const isInf = slot => (c.inherited || []).indexOf(slot) >= 0;
    const confirm = slot => { c.inherited = (c.inherited || []).filter(x => x !== slot); };

    const en = el('select', isInf('entityId') ? 'inf' : null);
    [{id:'',canonical:'대상 없음'}].concat(state.entities).forEach(e => {
      const o = el('option', null, e.canonical); o.value = e.id;
      if (c.entityId === e.id) o.selected = true; en.appendChild(o);
    });
    en.onchange = () => { c.entityId = en.value; confirm('entityId'); render(); };
    s.appendChild(en);

    const lo = el('select', isInf('locationId') ? 'inf' : null);
    const lopts = [['', '장소 없음']].concat(Object.keys(state.locations).map(k => [k, state.locations[k].name]));
    lopts.forEach(p => {
      const o = el('option', null, p[1]); o.value = p[0];
      if (c.locationId === p[0]) o.selected = true; lo.appendChild(o);
    });
    lo.onchange = () => { c.locationId = lo.value; confirm('locationId'); render(); };
    s.appendChild(lo);

    if (c.kind === 'observation'){
      const ac = el('select', isInf('actorId') ? 'inf' : null);
      [''].concat(speakers()).forEach(sp => {
        const o = el('option', null, sp ? sp + ' 관찰' : '대상 없음'); o.value = sp;
        if (c.actorId === sp) o.selected = true; ac.appendChild(o);
      });
      ac.onchange = () => { c.actorId = ac.value; confirm('actorId'); render(); };
      s.appendChild(ac);
    }

    s.appendChild(sel(null, c.polarity, OPT.polarity, v => { c.polarity = v; render(); }));
    s.appendChild(sel(null, c.modality, OPT.modality, v => { c.modality = v; render(); }));
    s.appendChild(sel(null, c.scope, OPT.scope, v => { c.scope = v; render(); }));
    s.appendChild(sel(null, c.sourceType, OPT.sourceType, v => { c.sourceType = v; render(); }));

    // 타임라인 배치. 초 대신 이것으로 시점을 다룬다.
    const phs = el('select', c.phase ? null : 'inf');
    [['', '구간 미배치']].concat(state.phases.map(p => [p, p])).forEach(p => {
      const o = el('option', null, p[1]); o.value = p[0];
      if ((c.phase || '') === p[0]) o.selected = true; phs.appendChild(o);
    });
    phs.onchange = () => { c.phase = phs.value; render(); };
    s.appendChild(phs);

    const vf = el('label','lbl');
    const vb = el('input'); vb.type = 'checkbox'; vb.checked = !!c.verifiable;
    vb.onchange = () => { c.verifiable = vb.checked; render(); };
    vf.appendChild(vb); vf.appendChild(document.createTextNode(' 검증가능'));
    s.appendChild(vf);

    n.appendChild(s);
    host.appendChild(n);
  });
}

function renderTimeline(a){
  const pe = $('#phedit'); pe.innerHTML = '';
  pe.appendChild(el('span','lbl','구간'));
  state.phases.forEach((p, i) => {
    const inp = el('input'); inp.value = p;
    inp.onchange = () => {
      const old = state.phases[i], nu = inp.value.trim() || old;
      state.claims.forEach(c => { if (c.phase === old) c.phase = nu; });
      state.phases[i] = nu; render();
    };
    pe.appendChild(inp);
  });
  const add = el('button','ghost','구간 추가');
  add.onclick = () => { state.phases.push('구간' + (state.phases.length + 1)); render(); };
  pe.appendChild(add);
  if (state.phases.length > 2){
    const rm = el('button','ghost','마지막 삭제');
    rm.onclick = () => {
      const gone = state.phases.pop();
      state.claims.forEach(c => { if (c.phase === gone) c.phase = ''; });
      render();
    };
    pe.appendChild(rm);
  }

  const host = $('#tl'); host.innerHTML = '';
  const sps = speakers();
  if (!sps.length){ host.appendChild(el('div','empty','진술이 없습니다.')); return; }

  // 모순에 얽힌 원자를 표시하기 위해 id 를 모아 둔다
  const hot = new Set();
  a.conflicts.forEach(c => { if (!c.gapOnly){ hot.add(c.a.id); hot.add(c.b.id); } });

  const g = el('div','tlg');
  g.style.gridTemplateColumns = '58px repeat(' + state.phases.length + ', minmax(96px, 1fr))';
  g.appendChild(el('div','hd'));
  state.phases.forEach(p => g.appendChild(el('div','hd lbl', p)));

  sps.forEach(sp => {
    g.appendChild(el('div','who', sp));
    state.phases.forEach(p => {
      const cell = el('div','cell');
      const here = state.claims.filter(c => c.speaker === sp && c.phase === p);
      if (!here.length){ cell.className = 'cell gap'; cell.appendChild(el('span','dash','—')); }
      else here.forEach(c => {
        const ch = el('span','chip' + (hot.has(c.id) ? ' hot' : '') +
                              (c.sourceType === 'evidence' ? ' ev' : ''), c.id);
        ch.title = c.quote;
        cell.appendChild(ch);
      });
      g.appendChild(cell);
    });
  });
  host.appendChild(g);

  const unplaced = state.claims.filter(c => !c.phase);
  if (unplaced.length){
    const u = el('div','lbl warn');
    u.style.marginTop = '18px';
    u.textContent = '구간 미배치 ' + unplaced.length + ' · ' + unplaced.map(c => c.id).join(' ');
    host.appendChild(u);
  }
}

function renderConflicts(a){
  const host = $('#cflist'); host.innerHTML = '';
  if (!a.conflicts.length){ host.appendChild(el('div','empty','모순이 발견되지 않았습니다.')); return; }
  a.conflicts.forEach(c => {
    const n = el('div','cf');
    const t = el('div','top');
    t.appendChild(el('span','badge sev-' + c.severity, c.rule));
    t.appendChild(el('span','lbl', c.speakers.join(' · ')));
    t.appendChild(el('span','lbl', 'sev ' + c.sev.toFixed(2)));
    n.appendChild(t);
    if (c.gapOnly){
      n.appendChild(el('div','why', c.why));
    } else {
      const p = el('div','pair');
      [c.a, c.b].forEach(x => {
        const d = el('div','side' + (c.severity === 'hard' ? ' hot' : ''));
        d.appendChild(el('span','lbl', x.id + ' · ' + x.speaker + ' · ' + x.round + '차' +
          (FT.hasTime(x) ? ' · ' + x.startSec + '–' + x.endSec + 's' : ' · 시간 미지정')));
        d.appendChild(el('p', null, x.quote || '(원문 없음)'));
        p.appendChild(d);
      });
      n.appendChild(p);
      n.appendChild(el('div','why', c.why));
    }
    host.appendChild(n);
  });
}

function bar(label, v){
  const d = el('div','ax');
  d.appendChild(el('div','lbl', label));
  d.appendChild(el('div','v', v.toFixed(1)));
  const b = el('div','bar'); const i = el('i'); i.style.width = Math.max(0, Math.min(100, v)) + '%';
  b.appendChild(i); d.appendChild(b);
  return d;
}

function renderAssess(a){
  const rk = $('#rank'); rk.innerHTML = '';
  if (!a.scores.length){ rk.appendChild(el('div','empty','진술이 없습니다.')); $('#scores').innerHTML = ''; return; }
  rk.appendChild(el('div','lbl','조사 우선순위'));
  a.scores.forEach((s, i) => {
    const r = el('div','rk' + (i === 0 && s.suspicion > 0 ? ' top' : ''));
    r.appendChild(el('div','lbl', String(i + 1)));
    r.appendChild(el('div','who', s.speaker));
    r.appendChild(el('div','sc', s.suspicion.toFixed(1)));
    rk.appendChild(r);
    if (s.evidence.length){
      const e = el('div','rk'); e.style.borderTop = '0'; e.style.paddingTop = '0';
      e.appendChild(el('div',null,''));
      e.appendChild(el('div','ev', s.evidence.join('   ')));
      rk.appendChild(e);
    }
  });

  const host = $('#scores'); host.innerHTML = '';
  a.scores.forEach(s => {
    const n = el('div','sp');
    n.appendChild(el('div','nm', s.speaker));
    n.appendChild(el('div','stage','1단계 · 진술 구조'));
    const g1 = el('div','axes');
    g1.appendChild(bar('객관성', s.stage1.objectivity));
    g1.appendChild(bar('일관성', s.stage1.consistency));
    g1.appendChild(bar('통일성', s.stage1.unity));
    n.appendChild(g1);
    n.appendChild(el('div','stage','2단계 · 진술 내용'));
    const g2 = el('div','axes');
    g2.appendChild(bar('구체성', s.stage2.specificity));
    g2.appendChild(bar('개연성', s.stage2.plausibility));
    n.appendChild(g2);
    n.appendChild(el('div','lbl',
      '원자 ' + s.n + ' · 미설명 ' + s.gapSec + 's · 반전 ' + s.reversed + ' · 신규 ' + s.added + ' · 강모순 ' + s.hard));
    host.appendChild(n);
  });
}

/* ---- actions ---- */
$('#b-atomize').onclick = () => {
  const text = $('#i-text').value.trim();
  if (!text) return;
  const sp = $('#i-speaker').value.trim() || 'A';
  const proposals = FT.atomize(text, {
    speaker: sp, round: Number($('#i-round').value),
    sourceType: $('#i-src').value,
    locations: state.locations, entities: state.entities, phases: state.phases,
    speakers: Array.from(new Set(speakers().concat([sp])))
  });
  proposals.forEach(p => { p.id = nextId(sp); p.approved = true; state.claims.push(p); });
  $('#i-note').textContent = '원자 ' + proposals.length + '개 추가';
  $('#i-text').value = '';
  show('atoms');
};

$('#b-export').onclick = () => {
  const a = recompute();
  const blob = new Blob([JSON.stringify({
    exportedAt: new Date().toISOString(), version: 2,
    duration: state.duration, phases: state.phases,
    entities: state.entities, locations: state.locations,
    claims: state.claims, analysis: { conflicts: a.conflicts, scores: a.scores, gaps: a.gaps }
  }, null, 2)], { type: 'application/json' });
  const u = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = u; link.download = 'facttrace-' + Date.now() + '.json';
  link.click(); URL.revokeObjectURL(u);
};

$('#b-import').onclick = () => $('#f-import').click();
$('#f-import').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { ingestJSON(r.result); e.target.value = ''; };
  r.readAsText(f);
};

function ingestJSON(text){
  let d; try { d = JSON.parse(text); } catch (err) { alert('JSON 파싱 실패'); return; }
  if (d.phases && d.phases.length) state.phases = d.phases;
  if (d.entities) state.entities = d.entities;
  if (d.locations) state.locations = d.locations;
  if (d.duration) state.duration = d.duration;
  const raw = d.claims || [];
  state.claims = raw.map(c => FT.upgradeClaim(c, model()));
  if (!d.duration){
    state.duration = Math.max.apply(null, state.claims.map(c => c.endSec || 0).concat([300]));
  }
  show('atoms');
}

$('#b-clear').onclick = () => {
  if (!confirm('모든 원자를 지웁니다.')) return;
  state.claims = []; state.seq = 0; render();
};

$('#b-sample').onclick = () => {
  fetch('samples/case-money.json')
    .then(r => r.text()).then(ingestJSON)
    .catch(() => alert('samples/case-money.json 을 읽지 못했습니다. Import 로 직접 불러오세요.'));
};

document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => show(b.dataset.v); });

load();
show(state.claims.length ? 'atoms' : 'ingest');
window.__selftest = FT.selftest;
})();
</script>
